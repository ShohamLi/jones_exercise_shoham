name: Playwright Automation

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-automation:
    name: Run callback automation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npm run install-browser

      - name: Run automation
        run: npm start

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: before-submit-screenshot
          path: screenshots/before-submit.png
          if-no-files-found: warn
          retention-days: 7
